name: WangkaManager
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
targets:
  WangkaManager:
    type: application
    platform: macOS
    sources:
      - path: WangkaManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wangka.manager
        PRODUCT_NAME: WiSiM
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: WiSiM
        CODE_SIGN_ENTITLEMENTS: WangkaManager/WangkaManager.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Build WiSiM device bridge
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          BRIDGE_SOURCE="${PROJECT_DIR}/../WiSiMBridge"
          BRIDGE_OUTPUT="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bridge"
          "${BRIDGE_SOURCE}/scripts/build-universal.sh" "${BRIDGE_OUTPUT}"
    info:
      path: WangkaManager/Info.plist
      properties:
        CFBundleDisplayName: WiSiM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: 用于连接无线网卡的本地管理地址并管理短信。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  WangkaManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WangkaManagerTests
      - path: WangkaManager/Models
      - path: WangkaManager/Networking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wangka.manager.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WangkaManager:
    build:
      targets:
        WangkaManager: all
        WangkaManagerTests: [test]
    test:
      targets:
        - WangkaManagerTests
